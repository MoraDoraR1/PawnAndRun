<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>RunPawn</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3ede0;
    --surface: #fffaf0;
    --surface-2: #eadfc6;
    --ink: #2b2620;
    --muted: #6b6255;
    --board-light: #ede3c8;
    --board-dark: #4c7a5e;
    --board-frame: #3a2f22;
    --accent: #b5772e;
    --accent-ink: #fffaf0;
    --danger: #9c3b32;
    --shadow: 0 1px 0 rgba(43,38,32,0.08), 0 8px 24px rgba(43,38,32,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131f19;
      --surface: #1b2a22;
      --surface-2: #24362b;
      --ink: #f1e9d8;
      --muted: #a49a85;
      --board-light: #d9cba3;
      --board-dark: #2f5240;
      --board-frame: #0e1712;
      --accent: #dd9e52;
      --accent-ink: #1b1206;
      --danger: #e08277;
      --shadow: 0 1px 0 rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131f19;
    --surface: #1b2a22;
    --surface-2: #24362b;
    --ink: #f1e9d8;
    --muted: #a49a85;
    --board-light: #d9cba3;
    --board-dark: #2f5240;
    --board-frame: #0e1712;
    --accent: #dd9e52;
    --accent-ink: #1b1206;
    --danger: #e08277;
    --shadow: 0 1px 0 rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100%;
  }

  .table {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .plaque {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .plaque h1 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 36px);
    letter-spacing: 0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .plaque .tagline {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .status-row {
    display: flex;
    gap: 12px;
  }
  .readout {
    flex: 1;
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .readout .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .readout .value {
    font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 600;
  }

  .board-frame {
    position: relative;
    background: var(--board-frame);
    border-radius: 14px;
    padding: 10px;
    box-shadow: var(--shadow);
  }
  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: 3px;
    aspect-ratio: 5 / 7;
    border-radius: 6px;
    overflow: hidden;
  }
  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell.light { background: var(--board-light); }
  .cell.dark { background: var(--board-dark); }
  .cell.zone::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .cell.zone-legal::after { opacity: 0.28; }
  .cell.zone-blocked::after { background: var(--danger); opacity: 0.32; }

  .piece {
    position: relative;
    z-index: 2;
    font-size: min(9vw, 40px);
    line-height: 1;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.35));
    transition: transform 0.18s ease;
  }
  .piece.player { color: #f4f1e6; text-shadow: 0 0 0 #f4f1e6; }
  .piece.enemy { color: #201a14; text-shadow: 0 0 0 #201a14; }
  .piece.enter { animation: drop 0.2s ease; }
  @keyframes drop {
    from { transform: translateY(-14%); opacity: 0.5; }
    to { transform: translateY(0); opacity: 1; }
  }
  .piece.captured {
    animation: pop 0.22s ease forwards;
  }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  button.action {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 14px 8px;
    border-radius: 10px;
    border: none;
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease;
  }
  button.action .glyph { font-size: 20px; }
  button.action:not(:disabled):hover { transform: translateY(-1px); }
  button.action:not(:disabled):active { transform: translateY(1px); }
  button.action.ready {
    background: var(--accent);
    color: var(--accent-ink);
  }
  button.action:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  button.action:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .hint kbd {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--surface-2);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
  }

  .overlay {
    position: absolute;
    inset: 10px;
    background: rgba(19, 14, 8, 0.72);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .stamp {
    text-align: center;
    color: #f4ece0;
    transform: rotate(-6deg) scale(0.85);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(.2,1.4,.4,1), opacity 0.3s ease;
  }
  .overlay.show .stamp { transform: rotate(-6deg) scale(1); opacity: 1; }
  .stamp h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 34px;
    margin: 0 0 6px;
    border: 3px solid #d1685c;
    color: #f0a89e;
    padding: 4px 16px;
    display: inline-block;
    border-radius: 4px;
  }
  .stamp .final-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    margin: 10px 0 16px;
    color: #e7ddc8;
  }
  .stamp button {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .piece, button.action, .overlay, .stamp, .cell.zone::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="table">
  <div class="plaque">
    <h1>RunPawn</h1>
    <div class="tagline">체스 폰, 홀로 라인을 지킨다</div>
  </div>

  <div class="status-row">
    <div class="readout">
      <span class="label">점수</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="readout">
      <span class="label">최고 점수</span>
      <span class="value" id="best">0</span>
    </div>
    <div class="readout">
      <span class="label">턴</span>
      <span class="value" id="turn">0</span>
    </div>
  </div>

  <div class="board-frame">
    <div class="board" id="board" aria-label="7행 5열 게임 보드"></div>
    <div class="overlay" id="overlay">
      <div class="stamp">
        <h2>GAME OVER</h2>
        <div class="final-score">최종 점수 <span id="finalScore">0</span></div>
        <button id="restartBtn">다시 시작</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="action" id="btnLeft" title="좌측 대각선 포획 (←)">
      <span class="glyph">↙</span><span>좌측 포획</span>
    </button>
    <button class="action" id="btnForward" title="전진 (↑)">
      <span class="glyph">↑</span><span>전진</span>
    </button>
    <button class="action" id="btnRight" title="우측 대각선 포획 (→)">
      <span class="glyph">↘</span><span>우측 포획</span>
    </button>
  </div>

  <div class="hint">방향키 <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd> 로도 조작할 수 있습니다</div>
</div>

<script>
(function () {
  const COLS = 5;
  const TOP_ROW = 7;
  const PLAYER_ROW = 1;
  const FRONT_ROW = 2;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const turnEl = document.getElementById('turn');
  const overlayEl = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const btnLeft = document.getElementById('btnLeft');
  const btnForward = document.getElementById('btnForward');
  const btnRight = document.getElementById('btnRight');
  const restartBtn = document.getElementById('restartBtn');

  const BEST_KEY = 'runpawn_best_score';

  let playerCol, enemyRow, score, turn, spawnCooldown, gameOver, best;

  function init() {
    playerCol = 2;
    enemyRow = new Array(COLS).fill(null);
    score = 0;
    turn = 0;
    spawnCooldown = 2;
    gameOver = false;
    best = Number(localStorage.getItem(BEST_KEY) || 0);
    overlayEl.classList.remove('show');
    render();
  }

  function legal() {
    const front = enemyRow[playerCol] === FRONT_ROW;
    const canForward = !front;
    const canLeft = playerCol > 0 && enemyRow[playerCol - 1] === FRONT_ROW;
    const canRight = playerCol < COLS - 1 && enemyRow[playerCol + 1] === FRONT_ROW;
    const over = front && !canLeft && !canRight;
    return { front, canForward, canLeft, canRight, over };
  }

  function descend() {
    for (let c = 0; c < COLS; c++) {
      if (enemyRow[c] !== null) {
        enemyRow[c] -= 1;
        if (enemyRow[c] < PLAYER_ROW) enemyRow[c] = null;
      }
    }
  }

  // Enemies always spawn as a contiguous, simultaneous cluster (width >= 2).
  // Because every enemy in a cluster is placed at the same row and descends
  // in lockstep, whenever one member reaches row 2 a neighbor is guaranteed
  // to be there too - so a "front blocked + both diagonals empty" dead end
  // can never occur, regardless of which column the player is in.
  function trySpawn() {
    spawnCooldown -= 1;
    if (spawnCooldown > 0) return;

    const runs = [];
    let start = null;
    for (let c = 0; c < COLS; c++) {
      if (enemyRow[c] === null) {
        if (start === null) start = c;
      } else if (start !== null) {
        runs.push([start, c - 1]);
        start = null;
      }
    }
    if (start !== null) runs.push([start, COLS - 1]);

    const validRuns = runs.filter(r => r[1] - r[0] + 1 >= 2);
    if (validRuns.length === 0) {
      spawnCooldown = 1;
      return;
    }

    const run = validRuns[Math.floor(Math.random() * validRuns.length)];
    const runLen = run[1] - run[0] + 1;
    const maxWidth = Math.min(3, runLen);
    const width = maxWidth >= 3 && Math.random() < 0.3 ? 3 : 2;
    const maxStart = run[1] - width + 1;
    const startCol = run[0] + Math.floor(Math.random() * (maxStart - run[0] + 1));
    for (let c = startCol; c < startCol + width; c++) enemyRow[c] = TOP_ROW;

    const level = Math.min(5, Math.floor(score / 30));
    const min = Math.max(2, 5 - level);
    const max = Math.max(3, 7 - level);
    spawnCooldown = min + Math.floor(Math.random() * (max - min + 1));
  }

  function act(action) {
    if (gameOver) return;
    const L = legal();
    if (action === 'forward' && !L.canForward) return;
    if (action === 'left' && !L.canLeft) return;
    if (action === 'right' && !L.canRight) return;

    if (action === 'left') {
      score += 10;
      enemyRow[playerCol - 1] = null;
      playerCol -= 1;
    } else if (action === 'right') {
      score += 10;
      enemyRow[playerCol + 1] = null;
      playerCol += 1;
    }

    turn += 1;
    descend();
    trySpawn();

    const after = legal();
    if (after.over) {
      gameOver = true;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
    }
    render();
  }

  function render() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    turnEl.textContent = turn;

    boardEl.innerHTML = '';
    for (let r = TOP_ROW; r >= PLAYER_ROW; r--) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        const isLight = (r + c) % 2 === 0;
        cell.className = 'cell ' + (isLight ? 'light' : 'dark');

        if (r === FRONT_ROW) {
          cell.classList.add('zone');
          if (c === playerCol && enemyRow[c] === FRONT_ROW) {
            cell.classList.add('zone-blocked');
          } else if ((c === playerCol - 1 || c === playerCol + 1) && enemyRow[c] === FRONT_ROW) {
            cell.classList.add('zone-legal');
          }
        }

        if (r === PLAYER_ROW && c === playerCol) {
          const p = document.createElement('span');
          p.className = 'piece player';
          p.textContent = '♙';
          cell.appendChild(p);
        } else if (enemyRow[c] === r) {
          const p = document.createElement('span');
          p.className = 'piece enemy enter';
          p.textContent = '♟';
          cell.appendChild(p);
        }
        boardEl.appendChild(cell);
      }
    }

    const L = legal();
    btnForward.disabled = gameOver || !L.canForward;
    btnLeft.disabled = gameOver || !L.canLeft;
    btnRight.disabled = gameOver || !L.canRight;
    btnForward.classList.toggle('ready', !btnForward.disabled);
    btnLeft.classList.toggle('ready', !btnLeft.disabled);
    btnRight.classList.toggle('ready', !btnRight.disabled);

    if (gameOver) {
      finalScoreEl.textContent = score;
      overlayEl.classList.add('show');
    }
  }

  btnLeft.addEventListener('click', () => act('left'));
  btnForward.addEventListener('click', () => act('forward'));
  btnRight.addEventListener('click', () => act('right'));
  restartBtn.addEventListener('click', init);

  window.addEventListener('keydown', (e) => {
    if (gameOver && (e.key === 'Enter' || e.key === ' ')) { init(); return; }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') act('forward');
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') act('left');
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') act('right');
  });

  init();
})();
</script>
</body>
</html>
